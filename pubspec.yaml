name: inri_driver
description: Aplicación Flutter para conductores.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.5
  iconsax: ^0.0.8
  google_fonts: ^6.0.0
  hexcolor: ^3.0.1

  # Estado
  bloc: ^9.0.0
  flutter_bloc: ^9.1.0
  hydrated_bloc: ^10.0.0
  provider: ^6.0.3
  equatable: ^2.0.5

  # Funcionalidad
  http: ^1.1.0
  intl: ^0.18.1
  cron: ^0.5.1
  path_provider: ^2.0.14
  flutter_secure_storage: ^8.0.0
  permission_handler: ^11.3.0
  connectivity_plus: ^5.0.2
  socket_io_client: ^2.0.1
  webview_flutter: ^4.5.0

  # Localización y mapas
  geolocator: ^11.0.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  geocoding: ^3.0.0

  # Notificaciones y servicios en segundo plano
  flutter_local_notifications: ^17.2.1+2
  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/car2.webp
    - assets/icon.webp   
    - assets/remis.webp
    - assets/map.webp
    - assets/fontana.webp
    - assets/barranqueras.webp
    - assets/logo.png
    - assets/background_image.webp
    - assets/car_b.png
    - assets/tarifas.json
